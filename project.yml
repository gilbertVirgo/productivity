name: Stint
options:
  bundleIdPrefix: dev.stint
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.2"
packages:
  Core:
    path: Shared
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    STINT_SUPABASE_URL: "http:/$()/127.0.0.1:54321"
    STINT_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      # Production values go here once the hosted project exists. Empty = "Sync not configured", never 127.0.0.1.
      STINT_SUPABASE_URL: ""
      STINT_SUPABASE_ANON_KEY: ""
targets:
  StintMac:
    type: application
    platform: macOS
    sources:
      - Mac
      - path: SharedUI
        excludes: [WeekBars.swift, SnapshotStore.swift, StartLink.swift]
    dependencies:
      - package: Core
      - package: Core
        product: StintData
      - package: Supabase
        product: Supabase
    info:
      path: Mac/Info.plist
      properties:
        CFBundleName: Stint
        CFBundleDisplayName: Stint
        LSMultipleInstancesProhibited: true
        StintSupabaseURL: $(STINT_SUPABASE_URL)
        StintSupabaseAnonKey: $(STINT_SUPABASE_ANON_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: "Stint reads the website in your current Safari or Chrome tab to tell whether you're on task. It never reads page content."
    entitlements:
      path: Mac/Stint.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_NAME: Stint
        PRODUCT_BUNDLE_IDENTIFIER: dev.stint.mac
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 63Q7M3DVRK
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets: [StintMacTests]
  StintMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [MacTests]
    dependencies:
      - target: StintMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stint.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 63Q7M3DVRK
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stint.app/Contents/MacOS/Stint"
        BUNDLE_LOADER: "$(TEST_HOST)"
  StintPhone:
    type: application
    platform: iOS
    sources: [iOS, SharedUI]
    dependencies:
      - target: StintWidgets
      - package: Core
      - package: Core
        product: StintData
      - package: Supabase
        product: Supabase
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Stint
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        StintSupabaseURL: $(STINT_SUPABASE_URL)
        StintSupabaseAnonKey: $(STINT_SUPABASE_ANON_KEY)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.stint.ios
            CFBundleURLSchemes: [stint]
    entitlements:
      path: iOS/Stint.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.stint]
    settings:
      base:
        PRODUCT_NAME: Stint
        PRODUCT_BUNDLE_IDENTIFIER: dev.stint.ios
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets: [StintPhoneTests]
  StintPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iOSTests]
    dependencies:
      - target: StintPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stint.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stint.app/Stint"
        BUNDLE_LOADER: "$(TEST_HOST)"
  StintWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - SharedUI/Theme.swift
      - SharedUI/WeekBars.swift
      - SharedUI/SnapshotStore.swift
      - SharedUI/StartLink.swift
    dependencies:
      - package: Core
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Stint
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/StintWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.stint]
    settings:
      base:
        PRODUCT_NAME: StintWidgets
        PRODUCT_BUNDLE_IDENTIFIER: dev.stint.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
